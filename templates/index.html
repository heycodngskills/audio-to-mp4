<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio to MP4 Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>Audio to MP4 Converter</h1>

      {% if error %}
      <div class="alert error">{{ error }}</div>
      {% endif %}

      {% if details %}
      <div class="details">{{ details|safe }}</div>
      {% endif %}

      <form method="post" enctype="multipart/form-data" class="converter-form">
        <label class="field">
          <span>Audio files</span>
          <input type="file" name="audio_files" multiple accept="audio/*" required />
        </label>

        <div class="row">
          <label class="field half">
            <span>Bitrate</span>
            <input type="text" name="bitrate" value="192k" />
          </label>

          <label class="field half">
            <span>Black video size</span>
            <input type="text" name="size" value="1280x720" />
          </label>
        </div>

        <fieldset class="field">
          <legend>Video background</legend>
          <label><input type="radio" name="background_type" value="audio" checked /> Audio-only MP4</label>
          <label><input type="radio" name="background_type" value="black" /> Solid black video</label>
          <label><input type="radio" name="background_type" value="image" /> Use image</label>
        </fieldset>

        <label class="field" id="image-upload">
          <span>Optional cover image</span>
          <input type="file" name="image_file" accept="image/*" />
        </label>

        <button type="submit">Convert to MP4</button>
      </form>
    </main>
  </body>
</html>
